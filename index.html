<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo ThirdWish · Inteligencia previsional para Profuturo</title>
<script>try{var t=localStorage.getItem('tw-demo-tema');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>

:root{
  --bg:#F6F2F4; --chrome:#2A1220; --chrome-2:#3A1B2D; --chrome-ink:#F7EEF3; --chrome-muted:#CDB6C3; --chrome-line:#5A3349;
  --panel:#FFFFFF; --paper:#FFFEFC; --ink:#24161D; --muted:#6F5D67; --line:#E7D9E1; --soft:#FBF6F9;
  --brand:#E6007E; --brand-ink:#A3005A; --brand-soft:#FBE2EF; --on-brand:#FFFFFF;
  --ok:#1D7A4C; --ok-soft:#E2F2E9; --warn:#9A5800; --warn-soft:#FCEED8; --risk:#B42318; --risk-soft:#FDE6E3;
  --info:#2E5AAC; --info-soft:#E6EEFB; --why:#5E4A55; --purpose:#FFF7FB;
  --map-text:#24161D; --map-box:#FFFFFF; --map-who:#E6EEFB; --map-edge:#E2D0DA;
  --shadow:0 1px 2px rgba(70,20,45,.06), 0 12px 32px rgba(70,20,45,.10);
  --serif:Georgia, "Times New Roman", Times, serif;
  --sans:Arial, "Helvetica Neue", Helvetica, sans-serif;
}
:root[data-theme="dark"]{
  --bg:#140E12; --chrome:#0E080B; --chrome-2:#1E1219; --chrome-line:#4A2A3C; --panel:#211820; --paper:#261C24; --ink:#F4EAF0; --muted:#B9A5B0; --line:#3A2B34; --soft:#1C1419;
  --brand:#FF3FA0; --brand-ink:#FF9ACB; --brand-soft:#3E1129; --on-brand:#1A0610;
  --ok:#62D39C; --ok-soft:#123222; --warn:#F2B75E; --warn-soft:#33240D; --risk:#FF8F86; --risk-soft:#3B1613; --info:#93B6FF; --info-soft:#17233B; --why:#CDB6C3; --purpose:#2A1A24;
  --map-text:#F4EAF0; --map-box:#2A1F27; --map-who:#17233B; --map-edge:#4A3843;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--sans)}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
a{color:var(--brand-ink)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Estructura */
.shell{display:grid;grid-template-columns:240px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
.top{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 18px;background:var(--chrome);color:var(--chrome-ink)}
.wm{font:700 12px/1 var(--sans);letter-spacing:.3em;color:#FF6BB5}
.top .prod{font-family:var(--serif);font-size:18px}
.top .day{color:var(--chrome-muted);font-size:13px}
.top .sp{flex:1}
.top select,.top .tbtn{background:var(--chrome-2);color:var(--chrome-ink);border:1px solid var(--chrome-line);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.top .tbtn[aria-pressed="true"]{border-color:#FF6BB5}
.top .tbtn.pri{background:#E6007E;border-color:#E6007E;color:#fff;font-weight:700}
.top .fict{font-size:12px;font-weight:700;background:#FCEED8;color:#9A5800;padding:4px 10px;border-radius:999px}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.rail button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--ink)}
.rail button:hover{background:var(--soft)}
.rail button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:700}
.rail button .ic{width:22px;height:22px;flex:none;color:var(--muted)}
.rail button[aria-current="page"] .ic{color:var(--brand-ink)}
.rail button .n{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted);white-space:nowrap}
.rail button.locked{opacity:.45}
.rail .sep{height:1px;background:var(--line);margin:10px 6px}
.rail .who{font-size:12.5px;color:var(--muted);padding:6px 10px}
main{padding:20px 22px 120px;min-width:0}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .rail button{width:auto;white-space:nowrap}
  .rail .sep,.rail .who{display:none}
  main{padding:16px 16px 150px}
}

/* Explicaciones */
.purpose{background:var(--purpose);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:13.5px;line-height:1.55}
.purpose b{color:var(--brand-ink)}
.purpose .with{display:block;margin-top:4px;color:var(--muted);font-size:12.5px}
.why{font-size:12.5px;color:var(--why);margin:-4px 0 10px;padding-left:10px;border-left:2px solid var(--brand-soft)}
body.sin-explicaciones .purpose,body.sin-explicaciones .why{display:none}

/* Piezas comunes */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px}
.head h1{font-size:26px}
.head p{margin:4px 0 0;color:var(--muted);max-width:72ch}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.grid4{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.box h2{font-size:19px;margin-bottom:8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;margin-right:4px;vertical-align:middle}
.t-brand{background:var(--brand-soft);color:var(--brand-ink)}
.t-ok,.t-real{background:var(--ok-soft);color:var(--ok)}
.t-warn,.t-fict{background:var(--warn-soft);color:var(--warn)}
.t-risk{background:var(--risk-soft);color:var(--risk)}
.t-info{background:var(--info-soft);color:var(--info)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.ghost{background:none}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cite{border:0;background:var(--info-soft);color:var(--info);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer;margin:2px 4px 2px 0}
.cite:hover{text-decoration:underline}

/* Hoy */
.kpi{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px;cursor:pointer}
.kpi:hover{border-color:var(--brand)}
.kpi .v{font:400 32px/1 var(--serif);color:var(--brand-ink)}
.kpi .l{display:block;margin-top:6px;font-weight:700}
.kpi .s{display:block;font-size:12.5px;color:var(--muted)}
.feed{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card.urg{border-left:5px solid var(--risk)}
.card.ask{border-left:5px solid var(--warn)}
.card .src{font-weight:700;font-size:12px;color:var(--brand-ink);padding-top:3px}
.card h3{font:700 15px/1.35 var(--sans);margin:0 0 3px}
.card p{margin:0;color:var(--muted)}
.card .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
@media (max-width:700px){.card{grid-template-columns:1fr}.card .acts{align-items:flex-start;flex-direction:row;flex-wrap:wrap}}
.welcome{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--chrome);color:var(--chrome-ink);border-radius:12px;padding:14px 18px;margin-bottom:16px}
.welcome b{font-family:var(--serif);font-weight:400;font-size:19px}
.welcome .btn.pri{background:#E6007E;border-color:#E6007E;color:#fff}
.sect{margin:18px 0 8px;font:700 13px var(--sans);color:var(--muted)}

/* Papel: normas y contratos */
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:26px 30px;font:16px/1.7 var(--serif);color:var(--ink)}
.paper h3{font:700 12px/1.3 var(--sans);letter-spacing:.04em;color:var(--muted);margin:0 0 10px}
.paper .art{margin:0 0 14px}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.diff{grid-template-columns:1fr}.paper{padding:18px}}
.diff .col{border-top:3px solid var(--line);padding-top:8px}
.diff .col.new{border-top-color:var(--brand)}
del{background:var(--risk-soft);color:var(--risk)}
ins{background:var(--ok-soft);color:var(--ok);text-decoration:none}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font:700 13px var(--sans);cursor:pointer;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 12px;cursor:pointer}
.li:hover{border-color:var(--brand)}
.li[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.li b{display:block}
.clause{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;margin:0 0 10px;border-radius:6px;font:16px/1.7 var(--serif);cursor:default}
.clause.flag{box-shadow:inset 3px 0 0 var(--warn);background-color:var(--warn-soft);cursor:pointer}
.clause.flag.risk{box-shadow:inset 3px 0 0 var(--risk);background-color:var(--risk-soft)}
.clause.flag.fixed{box-shadow:inset 3px 0 0 var(--ok);background-color:var(--ok-soft)}
.clause.sel{outline:2px solid var(--brand)}
.alert{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;background:var(--panel);margin-bottom:8px;cursor:pointer}
.alert.risk{border-left-color:var(--risk)}
.alert.fixed{border-left-color:var(--ok);opacity:.85}
.alert.sel{outline:2px solid var(--brand)}
.alert b{display:block;font-size:14px}
.alert p{margin:4px 0 6px;font-size:13px;color:var(--muted)}

/* Mapa */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.mapwrap{grid-template-columns:1fr}}
svg.map{width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.node{cursor:pointer}
.node:hover circle,.node:hover rect,.node:focus circle,.node:focus rect{stroke-width:3}
.node:focus{outline:none}
.node text{font:12.5px var(--sans);fill:var(--map-text);pointer-events:none}
.node .box-item{fill:var(--map-box)}
.node .box-who{fill:var(--map-who)}
.node.on circle,.node.on rect{stroke:#E6007E;stroke-width:3.5}
.edge{stroke:var(--map-edge);stroke-width:2}
.edge.on{stroke:#E6007E}

/* Plazos */
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover td{background:var(--soft)}
tbody tr.sel td{background:var(--brand-soft)}
.tblw{overflow-x:auto}
.tblw table{min-width:720px}
.vig{position:relative;margin:8px 0 4px;padding:40px 0 12px}
.vig .bar{display:flex;height:14px;border-radius:999px;overflow:hidden}
.vig .old{background:var(--info-soft);flex:9}
.vig .gap{background:repeating-linear-gradient(45deg,var(--warn-soft),var(--warn-soft) 6px,var(--panel) 6px,var(--panel) 12px);flex:2}
.vig .new{background:var(--ok-soft);flex:2}
.vig .mk{position:absolute;top:0;transform:translateX(-50%);font-size:11.5px;text-align:center;white-space:nowrap;color:var(--muted);line-height:1.25}
.vig .mk::after{content:"";display:block;width:2px;height:12px;background:currentColor;margin:2px auto 0}
.vig .mk.me{color:var(--brand-ink);font-weight:700}
@media (max-width:600px){.vig{padding-top:26px}.vig .mk{font-size:10.5px}.vig .mk .d{display:none}}
.vig .lbls{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:12px;margin-top:4px}
.cal .wd{text-align:center;color:var(--muted);font-weight:700;padding:3px 0}
.cal button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 0;cursor:pointer;font-size:12px}
.cal button.inh{background:var(--risk-soft);color:var(--risk);border-color:transparent}
.cal button.cnt{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:700}
.cal button.pub{background:var(--info-soft);color:var(--info);border-color:transparent;font-weight:700}
.cal button.end{background:#E6007E;color:#fff;border-color:transparent;font-weight:700}
.cal span.em{visibility:hidden}
.daynote{min-height:42px;margin-top:8px;font-size:13px;background:var(--soft);border-radius:8px;padding:8px 10px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chain span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;background:var(--panel)}
.chain span.on{border-color:var(--risk);color:var(--risk);font-weight:700}
.chain span.done{border-color:var(--ok);color:var(--ok);font-weight:700}
.steps{margin:6px 0 0;padding-left:20px}
.steps li{margin:4px 0}

/* Contratos */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:800px){.kanban{grid-template-columns:1fr}}
.colk{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px}
.colk h3{font:700 13px var(--sans);color:var(--muted);margin:2px 4px 8px}
.kcard{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
.kcard:hover{border-color:var(--brand)}
.kcard[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.kcard b{display:block}
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0 4px}
.prog span{font-size:11.5px;text-align:center;color:var(--muted);padding-top:8px;border-top:4px solid var(--line)}
.prog span.done{border-top-color:var(--ok);color:var(--ok)}
.prog span.now{border-top-color:var(--brand);color:var(--brand-ink);font-weight:700}
.docs{list-style:none;margin:8px 0 0;padding:0}
.docs li{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.docs .st{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--warn-soft);color:var(--warn)}
.docs .st.ok{background:var(--ok-soft);color:var(--ok)}
.docs .tx{flex:1}
.docs .tx small{display:block;color:var(--muted)}

/* Asistente de solicitud */
.wsteps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.wsteps span{font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 12px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.wsteps span.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.wsteps span.done{border-color:var(--ok);color:var(--ok)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:700px){.opts{grid-template-columns:1fr}}
.opt{display:block;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px;cursor:pointer}
.opt:hover{border-color:var(--brand)}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt b{display:block}
.result{border-radius:12px;padding:14px 16px;margin-top:6px}
.result.ok{background:var(--ok-soft)}
.result.go{background:var(--warn-soft)}

/* Consulta */
.chat{display:flex;flex-direction:column;gap:12px;min-height:220px}
.q{align-self:flex-end;max-width:80%;background:var(--chrome);color:var(--chrome-ink);border-radius:14px 14px 3px 14px;padding:10px 14px}
.a{align-self:flex-start;max-width:94%;background:var(--paper);border:1px solid var(--line);border-radius:14px 14px 14px 3px;padding:12px 14px;font:15.5px/1.6 var(--serif)}
.a .meta{font:12.5px var(--sans);color:var(--muted);margin-top:8px}
.ask{display:flex;gap:8px;margin-top:12px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--panel);color:var(--ink)}
.sugg{display:flex;flex-direction:column;gap:8px}

/* Agentes */
.agent{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);margin-bottom:8px}
.meter{grid-column:1 / -1;height:6px;border-radius:999px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.meter span{display:block;height:100%;background:var(--brand)}
.switch{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer;background:var(--ok-soft);color:var(--ok)}
.switch.off{background:var(--soft);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:700}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.fld{margin-bottom:12px}
.fld label,.fld .lb{display:block;font-weight:700;font-size:12.5px;margin-bottom:5px}
.fld input[type=text],.fld textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);color:var(--ink)}
.fld textarea{min-height:64px;resize:vertical}
.lock{font-size:12.5px;color:var(--ok);background:var(--ok-soft);border-radius:8px;padding:6px 10px;margin-top:6px}

/* Panel */
.sem{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}
.bars div{flex:1;background:var(--brand-soft);border-radius:6px 6px 0 0;position:relative}
.bars div span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}

/* Traza */
.log td:first-child{white-space:nowrap;font-variant-numeric:tabular-nums}
tr.you td{background:var(--brand-soft)}

/* Cajón lateral */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:40;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s ease;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.drawer header{display:flex;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:19px;flex:1}
.drawer .body{padding:16px 18px;overflow:auto}
.scrim{position:fixed;inset:0;background:rgba(20,8,14,.25);z-index:39;display:none}
.scrim.on{display:block}

/* Recorrido */
.tour{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(720px,calc(100vw - 24px));background:#2A1220;color:#F7EEF3;border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;z-index:60;display:none}
.tour.on{display:block}
.tour .tt{font-family:var(--serif);font-size:18px;margin:2px 0 4px}
.tour p{margin:0 0 10px;color:#EBDCE4}
.tour .dots{display:flex;gap:5px}
.tour .dots i{width:8px;height:8px;border-radius:50%;background:#6A3D57}
.tour .dots i.on{background:#FF6BB5}
.tour .btn{background:#3A1B2D;border-color:#5A3349;color:#F7EEF3}

.heat.h1{background:var(--panel)}
.heat.h2{background:var(--brand-soft)}

.orden li .n{font-family:var(--serif);font-size:20px;color:var(--brand-ink)}
.orden li .mv{display:flex;gap:4px}
.orden li .mv button{border:1px solid var(--line);background:var(--soft);border-radius:6px;width:28px;height:26px;cursor:pointer}
.orden li .mv button[disabled]{opacity:.35;cursor:not-allowed}

.frow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}

.frow .crit{font-size:13.5px}

.frow .fq{font:700 14px var(--sans);color:var(--risk);white-space:nowrap}
.frow.off .fq{color:var(--muted);text-decoration:line-through}
.tog{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;border:0;flex:none}

.tog[aria-pressed="true"]{background:var(--brand)}

.fres{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px;border-radius:10px;background:var(--chrome);color:var(--chrome-ink)}

svg.quad{width:100%;height:auto;display:block}

.zona .zn{font-family:var(--serif);font-size:26px;fill:var(--brand-ink)}

.quad .ax{stroke:var(--muted);stroke-width:1.5}

.quad .pt.g{fill:var(--muted);opacity:.45}

.ctab span{font-size:12px;color:var(--muted)}

.ficha3{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}

.segchip.liq{background:var(--ok-soft);color:var(--ok)}

.vias{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

/* ===================== Utilidades ===================== */
function hhmm(m){ var h = Math.floor(m/60), mi = m%60; return (h<10?'0':'')+h+':'+(mi<10?'0':'')+mi; }
function log(a, who){
  S.mins += 1;
  S.log.unshift({h:hhmm(S.mins), who:who || ('Tú · ' + ROLE_NAME[S.role]), you:!who, ag:!!who, a:a});
  $('#clock').textContent = 'Jueves 3 de diciembre de 2026 · ' + hhmm(S.mins);
}
var toastT;
function toast(msg){ var t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 2800); }

function atendibles(){
  var x = DATA.semana.atendibles;
  CRIT.forEach(function(c){ if (!S.crit[c.k]) x += DATA.motivosDescarte[c.k]; });
  return x;
}
function segsActivos(id){
  if (id === 'jorge'){
    var e = S.jorge, a = [];
    if (!e.incidencia) a.push('friccion');
    if (!e.retiro) a.push('retiro');
    a.push(e.aportacion ? 'seguirCont' : 'seguir');
    return a;
  }
  return CLIENTES[id].segs.slice();
}
function grupoDe(seg){
  if (seg === 'retencion') return 'retencion';
  if (seg === 'seguirCont') return 'ahorro';
  return DATA.segmentos[seg].prio;
}
function prioriza(id){
  var acc = ACC[id];
  return segsActivos(id).map(function(seg){
    var a = acc[seg];
    return {segmento:seg === 'seguirCont' ? 'seguir' : seg, clave:seg, grupo:grupoDe(seg), accion:a.ac, canal:a.canal, momento:a.cuando, porque:a.porque, urg:a.urg, carril:a.carril};
  }).sort(function(x, y){
    var d = S.orden.indexOf(x.grupo) - S.orden.indexOf(y.grupo);
    return d !== 0 ? d : y.urg - x.urg;
  });
}
function valor(sup){
  var R = DATA.real;
  return {
    profuturoRetencion: R.cedido2025 * sup.salida * R.comision,
    profuturoAhorro: R.ahorroCaptado2025 * sup.ahorro * R.comision,
    profuturoNomina: R.nominaTecho * sup.empleados,
    grupoRetiro: R.disposicion2025 * sup.retiro,
    diagnosticos: sup.diag * 0.1
  };
}
function supuestos(){ return {salida:S.sup.salida/100, ahorro:S.sup.ahorro/100, empleados:S.sup.empleados/100, retiro:S.sup.retiro/100, diag:S.sup.diag}; }

/* ===================== Navegación ===================== */
function go(route, param){
  var h = '#/' + route + (param ? '/' + param : '');
  if (location.hash === h){ parse(); render(); } else location.hash = h;
}
function parse(){
  var p = (location.hash || '#/hoy').replace(/^#\//,'').split('/');
  S.route = TODAS.indexOf(p[0]) >= 0 ? p[0] : 'hoy';
  S.param = p[1] || null;
}
window.addEventListener('hashchange', function(){ if ($('#drawer').classList.contains('open')) closeDrawer(); parse(); render(); if (!tourOn){ $('#view').focus({preventScroll:true}); window.scrollTo(0,0); } });

function rail(){
  var allowed = PERM[S.role];
  var counts = S.role === 'valmex' ? {grupo:12} : {segmentacion:6, atendibles:n(atendibles()), clientes:4, traza:S.log.length};
  $('#rail').innerHTML = ROUTES.map(function(r){
    var lock = allowed.indexOf(r.id) < 0;
    return '<button data-go="' + r.id + '"' + (S.route === r.id ? ' aria-current="page"' : '') + (lock ? ' class="locked"' : '') + '>' +
      '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + ICON[r.ic] + '</svg><span>' + r.t + '</span>' +
      (lock ? '<span class="n">sin permiso</span>' : (counts[r.id] ? '<span class="n">' + counts[r.id] + '</span>' : '')) + '</button>';
  }).join('') + '<div class="sep"></div><div class="who">Sesión: ' + esc(ROLE_NAME[S.role]) + '. ' +
    (S.role === 'valmex' ? 'Valmex ve solo lo suyo. Los datos de la cartera de la Afore no se ven, tampoco agregados.' : 'Todo funciona dentro de la infraestructura de Profuturo. Los permisos los fija Profuturo por rol.') + '</div>';
}

  if (k) log('Cambia el supuesto «' + CALC.filter(function(c){ return c.k === k; })[0].t + '» a ' + S.sup[k] + (k === 'diag' ? '' : '%'));
});
$('#dr-close').addEventListener('click', closeDrawer);
$('#scrim').addEventListener('click', closeDrawer);
$('#role').addEventListener('change', function(e){ if (tourOn) endTour(); setRole(e.target.value); if (PERM[S.role].indexOf(S.route) < 0) go(PERM[S.role][0]); else render(); });
$('#ex-toggle').addEventListener('click', function(){ var on = this.getAttribute('aria-pressed') !== 'true'; this.setAttribute('aria-pressed', String(on)); this.textContent = on ? 'Explicaciones: sí' : 'Explicaciones: no'; document.body.classList.toggle('sin-explicaciones', !on); });
function syncTheme(){ var dark = document.documentElement.getAttribute('data-theme') === 'dark'; var b = $('#theme-toggle'); b.textContent = dark ? 'Modo claro' : 'Modo oscuro'; b.setAttribute('aria-pressed', String(dark)); }
$('#theme-toggle').addEventListener('click', function(){ var dark = document.documentElement.getAttribute('data-theme') !== 'dark'; document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light'); try{ localStorage.setItem('tw-demo-tema', dark ? 'dark' : 'light'); }catch(err){} syncTheme(); });
syncTheme();

/* ===================== Recorrido ===================== */
var TOUR = [
  {r:'hoy', role:'direccion', sel:'#hoy-kpis', t:'Lo que hay en juego', p:'La dirección abre la plataforma y ve cuántas candidatas hay, cuántas acciones salen, cuántas se descartan y el saldo que se fue de Profuturo en 2025.'},
  {r:'segmentacion', role:'direccion', sel:'#matriz', t:'Seis segmentos que se superponen', p:'Sus 4 segmentos por valor, cruzados con 6 segmentos de atención por comportamiento. A quien necesita liquidez no se le pide ahorro.'},
  {r:'atendibles', role:'direccion', sel:'#cuadrante-box', t:'A quién atender y a quién no', p:'El riesgo de salida no basta. Se actúa donde se estima que la atención cambia el resultado. Cada zona se abre.'},
  {r:'clientes/jorge', role:'direccion', sel:'#prioridades', t:'Jorge resuelve su incidencia', p:'La fricción deja de estar activa y su retiro pasa al primer lugar. La prioridad cambia con cada respuesta del cliente.', pre:function(){ S.jorge = {incidencia:false, retiro:false, aportacion:false, interes:false}; A.jorge('incidencia'); }},
  {r:'medicion', role:'direccion', sel:'#med', t:'Comprobar si la atención ayudó', p:'Se compara la atención propuesta con la habitual en dos grupos parecidos. En retención, medio punto todavía no es concluyente y se sigue midiendo. Nada se pasa a pesos hasta saber cuánto saldo se queda y cuánto tiempo.', pre:function(){ S.metrica = 'retencion'; }},
  {r:'grupo', role:'valmex', sel:'#valmex-vista', t:'Valmex no ve datos de la Afore', p:'Con el perfil de Valmex solo se ven las citas que los clientes pidieron por su cuenta. Nada de la cartera de la Afore, ni agregado.'},
  {r:'traza', role:'direccion', sel:'#log', t:'Todo queda registrado', p:'Cada decisión de la plataforma y cada clic, también los tuyos en esta demo. Todo sigue siendo clicable.'}
];
var tourOn = false, tourI = 0;
function startTour(){ S.orden = DATA.prioridad.slice(); tourOn = true; tourI = 0; document.body.classList.add('tour-on'); $('#tour').classList.add('on'); showStep(); }
function endTour(){ tourOn = false; document.body.classList.remove('tour-on'); $('#tour').classList.remove('on'); $$('.spot').forEach(function(x){ x.classList.remove('spot'); }); if (S.role !== 'direccion'){ setRole('direccion', true); render(); } }
function tourStep(d){ var k = tourI + d; if (k < 0) return; if (k >= TOUR.length){ endTour(); toast('Recorrido terminado. Todo sigue siendo clicable.'); return; } tourI = k; showStep(); }
function showStep(){
  var s = TOUR[tourI];
  if (S.role !== s.role) setRole(s.role, true);
  if (s.pre) s.pre();
  if ($('#drawer').classList.contains('open')) closeDrawer();
  $('#tour-t').textContent = s.t; $('#tour-p').textContent = s.p; $('#tour-n').textContent = 'Paso ' + (tourI+1) + ' de ' + TOUR.length;
  $('#tour-dots').innerHTML = TOUR.map(function(_, i){ return '<i class="' + (i === tourI ? 'on' : '') + '"></i>'; }).join('');
  $('#tour-prev').disabled = tourI === 0; $('#tour-next').textContent = tourI === TOUR.length - 1 ? 'Terminar' : 'Siguiente';
  var p = s.r.split('/'); go(p[0], p[1]);
}
function spot(){
  $$('.spot').forEach(function(x){ x.classList.remove('spot'); });
  var s = TOUR[tourI]; if (!s || s.r.split('/')[0] !== S.route) return; var el = $(s.sel);
  if (el){ el.classList.add('spot'); var y = el.getBoundingClientRect().top + window.scrollY - 70; window.scrollTo(0, Math.max(0, y)); }
}
$('#tour-start').addEventListener('click', startTour);
$('#tour-next').addEventListener('click', function(){ tourStep(1); });
$('#tour-prev').addEventListener('click', function(){ tourStep(-1); });
$('#tour-exit').addEventListener('click', endTour);

window.DEMO = {DATA:DATA, S:S, prioriza:prioriza, valor:valor};
parse(); render();
})();

</script>
